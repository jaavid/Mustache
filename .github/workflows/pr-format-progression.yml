name: Format Mustache progression PR
on:
  pull_request:
    paths:
      - 'src/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/pr-format-progression.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feature/progression-gold-rush-referrals' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progression-gold-rush-referrals
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply repository Prettier rules to feature changes
        run: npx prettier --write src/game/goldVault.ts src/game/progressionUi.ts src/game/scenes.ts src/game/mobile.ts src/game/leaderboardOverlay.ts src/logic/gameMode.ts src/logic/shotResolution.ts src/logic/__tests__/modeRules.test.ts src/platform/competitiveScores.ts README.md docs/PLAYER_PROGRESSION.md
      - name: Commit formatted changes back to this PR branch
        run: |
          git add src/game src/logic/gameMode.ts src/logic/shotResolution.ts src/logic/__tests__/modeRules.test.ts src/platform/competitiveScores.ts README.md docs/PLAYER_PROGRESSION.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply Prettier to progression feature"
            git push origin HEAD:feature/progression-gold-rush-referrals
          fi
