name: Temporary Borhan formatter
on:
  push:
    branches:
      - feat/borhan-character-selection
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'style: format Borhan feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/borhan-character-selection
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format feature files
        run: npx prettier --write src/game/art.ts src/game/characterChoice.ts src/game/characterSelect.ts src/game/facialAtlas.ts src/game/ramin.ts src/game/raminMoments.ts src/game/scenes.ts src/game/mobile.ts src/game/overlays.ts src/main.ts src/logic/__tests__/characterChoice.test.ts tests/e2e/game.smoke.spec.ts README.md assets/manifest.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game src/main.ts src/logic/__tests__/characterChoice.test.ts tests/e2e/game.smoke.spec.ts README.md assets/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "style: format Borhan feature"
            git push origin HEAD:feat/borhan-character-selection
          fi
