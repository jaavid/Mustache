name: Deploy Telegram Game Worker

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-game-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy @RJTtobot Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Worker syntax and bot tests
        run: |
          node --check bot/src/index.js
          node --check bot/src/scoring.js
          node --check bot/src/sessions.js
          npm run test:bot

      - name: Require production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET CLOUDFLARE_D1_DATABASE_ID; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error title=Missing production secret::Configure ${secret} in GitHub Actions secrets (production environment or repository)."
              exit 1
            fi
          done

      - name: Bind existing D1 database ID
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          value = os.environ['D1_ID']
          if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', value):
              raise SystemExit('CLOUDFLARE_D1_DATABASE_ID must be a UUID')
          path = Path('bot/wrangler.toml')
          text = path.read_text()
          placeholder = '00000000-0000-0000-0000-000000000000'
          if text.count(placeholder) != 1:
              raise SystemExit('Missing D1 database placeholder')
          path.write_text(text.replace(placeholder, value))
          PY

      - name: Apply remote D1 migrations before deploying Worker
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy Cloudflare Worker and sync encrypted bot secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          wranglerVersion: '4'
          command: deploy
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '### Telegram Game Worker deployed'
            echo ''
            echo "Commit: \`${GITHUB_SHA}\`"
            if [[ -n "${DEPLOYMENT_URL}" ]]; then
              echo "Worker: ${DEPLOYMENT_URL}"
            fi
            echo 'Telegram webhook configuration is a separate one-time, explicitly reviewed action.'
          } >> "${GITHUB_STEP_SUMMARY}"
