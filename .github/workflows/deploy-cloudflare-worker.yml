name: Deploy Telegram Game Worker

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'shared/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-game-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy @RJTtobot Worker
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Worker syntax and bot tests
        run: |
          node --check bot/src/index.js
          node --check bot/src/leaderboardMenu.js
          node --check bot/src/commandSync.js
          node --check bot/scripts/sync-commands.mjs
          node --check bot/src/scoring.js
          node --check bot/src/sessions.js
          npm run test:bot

      - name: Require production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          WALLET_SERVICE_KEY: ${{ secrets.WALLET_SERVICE_KEY }}
          ADMIN_TELEGRAM_USER_ID: ${{ vars.ADMIN_TELEGRAM_USER_ID }}
        run: |
          set -euo pipefail
          for secret in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET CLOUDFLARE_D1_DATABASE_ID WALLET_SERVICE_KEY ADMIN_TELEGRAM_USER_ID; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error title=Missing production secret::Configure ${secret} in GitHub Actions secrets (production environment or repository)."
              exit 1
            fi
          done
          if [[ ! "${ADMIN_TELEGRAM_USER_ID}" =~ ^[1-9][0-9]{0,18}$ ]]; then
            echo "::error::ADMIN_TELEGRAM_USER_ID must be a numeric Telegram ID."
            exit 1
          fi

      - name: Bind existing D1 database ID
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          ADMIN_TELEGRAM_USER_ID: ${{ vars.ADMIN_TELEGRAM_USER_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          value = os.environ['D1_ID']
          if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', value):
              raise SystemExit('CLOUDFLARE_D1_DATABASE_ID must be a UUID')
          path = Path('bot/wrangler.toml')
          text = path.read_text()
          placeholder = '00000000-0000-0000-0000-000000000000'
          if text.count(placeholder) != 1:
              raise SystemExit('Missing D1 database placeholder')
          operator_id = os.environ['ADMIN_TELEGRAM_USER_ID']
          if not re.fullmatch(r'[1-9][0-9]{0,18}', operator_id):
              raise SystemExit('Invalid operator Telegram ID')
          section = '[vars]\n'
          if text.count(section) != 1 or 'ADMIN_TELEGRAM_USER_ID =' in text:
              raise SystemExit('Cannot safely bind operator ID into Wrangler vars')
          text = text.replace(section, section + 'ADMIN_TELEGRAM_USER_ID = "' + operator_id + '"\n', 1)
          path.write_text(text.replace(placeholder, value))
          PY

      - name: Apply remote D1 migrations before deploying Worker
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote

      - name: Deploy Cloudflare Worker and sync encrypted bot secrets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          wranglerVersion: '4'
          command: deploy
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            WALLET_SERVICE_KEY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WALLET_SERVICE_KEY: ${{ secrets.WALLET_SERVICE_KEY }}

      - name: Register bot command menu without overwriting unrelated commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node bot/scripts/sync-commands.mjs

      - name: Verify live score API on direct Worker and custom domain
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            https://n5-mustache-rjttobot.zed-ai.workers.dev \
            https://mustache.zedai.ir; do
            success=0
            for attempt in 1 2 3; do
              if curl --silent --show-error --fail --max-time 12 \
                "${endpoint}/api/status" -o /tmp/mustache-score-status.json; then
                node -e "
                  const fs = require('fs');
                  const data = JSON.parse(fs.readFileSync('/tmp/mustache-score-status.json', 'utf8'));
                  if (data.service !== 'mustache-scores' || data.database !== 'connected' ||
                    !Number.isInteger(data.roundsStarted) || !Number.isInteger(data.roundsScored)) {
                    throw new Error('Production score status has no connected D1 binding');
                  }
                  console.log('Production API verified: ${endpoint}',
                    'started:', data.roundsStarted, 'accepted:', data.roundsScored);
                "
                success=1
                break
              fi
              sleep 3
            done
            if [[ "$success" != 1 ]]; then
              echo "::error title=Score API route not connected::${endpoint} does not serve the new Worker/D1 score API."
              exit 1
            fi
          done

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '### Telegram Game Worker deployed'
            echo ''
            echo "Commit: \`${GITHUB_SHA}\`"
            if [[ -n "${DEPLOYMENT_URL}" ]]; then
              echo "Worker: ${DEPLOYMENT_URL}"
            fi
            echo 'Telegram webhook configuration is a separate one-time, explicitly reviewed action.'
          } >> "${GITHUB_STEP_SUMMARY}"
