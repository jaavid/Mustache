name: Telegram Game integration checks

on:
  pull_request:
    paths:
      - 'bot/**'
      - 'src/platform/**'
      - 'src/game/replayUi.ts'
      - 'src/game/**'
      - 'src/logic/**'
      - 'src/assets/forest/**'
      - 'assets/forest/**'
      - 'tests/e2e/forest-assets.spec.ts'
      - 'src/game/scenes.ts'
      - 'src/game/mobile.ts'
      - 'src/game/ramin.ts'
      - 'src/assets/borhan-sheet.png'
      - 'assets/manifest.json'
      - 'docs/TELEGRAM_GAME.md'
      - 'index.html'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/telegram-game-checks.yml'
      - '.github/workflows/browser-smoke.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check || (for f in src/game/forestTreeAssets.ts src/logic/forestArtLayout.ts; do npx prettier $f | diff -u $f - || true; done; exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bot
      - run: npm run build
