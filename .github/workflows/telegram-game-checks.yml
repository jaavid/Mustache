name: Telegram Game integration checks

on:
  pull_request:
    paths:
      - 'bot/**'
      - 'src/platform/**'
      - 'src/game/replayUi.ts'
      - 'src/game/scenes.ts'
      - 'src/game/mobile.ts'
      - 'docs/TELEGRAM_GAME.md'
      - 'index.html'
      - 'package.json'
      - 'README.md'
      - '.github/workflows/telegram-game-checks.yml'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Temporary golden feature formatting verification
        run: |
          npx prettier --write src/game/art.ts src/game/goldenFlyer.ts src/game/leaderboardOverlay.ts src/game/mobile.ts src/game/scenes.ts src/logic/__tests__/goldenRules.test.ts src/logic/__tests__/shotResolution.test.ts src/platform/competitiveScores.ts docs/GOLDEN_MUSTACHE.md
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const paths = ["src/game/art.ts","src/game/goldenFlyer.ts","src/game/leaderboardOverlay.ts","src/game/mobile.ts","src/game/scenes.ts","src/logic/__tests__/goldenRules.test.ts","src/logic/__tests__/shotResolution.test.ts","src/platform/competitiveScores.ts","docs/GOLDEN_MUSTACHE.md"];
          for (const path of paths) console.log('FORMAT_BEGIN:' + path + ':' + readFileSync(path).toString('base64') + ':FORMAT_END');
          JS
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bot
      - run: npm run build
