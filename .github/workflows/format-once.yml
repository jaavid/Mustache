name: Format code and docs once
on:
  push:
    paths:
      - '.github/workflows/format-once.yml'
permissions:
  contents: write
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format tracked source and documentation
        run: npx prettier --write src/ scripts/ docs/ assets/ tests/ README.md CHANGELOG.md CONTRIBUTING.md package.json eslint.config.js vite.config.ts vitest.config.ts playwright.config.ts .github/workflows/pages.yml .github/workflows/browser-smoke.yml
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts docs assets tests README.md CHANGELOG.md CONTRIBUTING.md package.json eslint.config.js vite.config.ts vitest.config.ts playwright.config.ts .github/workflows/pages.yml .github/workflows/browser-smoke.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style: format TypeScript and docs consistently with Prettier'
            git push origin HEAD:main
          fi
