name: Deploy N5 Wallet (Amoy manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n5-wallet-amoy-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: wallet-testnet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test before deploying
        working-directory: wallet
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Validate required Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          N5_WALLET_D1_ID: ${{ vars.N5_WALLET_D1_ID }}
          N5_SCORES_D1_ID: ${{ vars.N5_SCORES_D1_ID }}
          WALLET_SERVICE_KEY: ${{ secrets.WALLET_SERVICE_KEY }}
          ADMIN_TELEGRAM_USER_ID: ${{ vars.ADMIN_TELEGRAM_USER_ID }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID N5_WALLET_D1_ID N5_SCORES_D1_ID WALLET_SERVICE_KEY ADMIN_TELEGRAM_USER_ID; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
          if [[ ! "${ADMIN_TELEGRAM_USER_ID}" =~ ^[1-9][0-9]{0,18}$ ]]; then
            echo "::error::ADMIN_TELEGRAM_USER_ID must be a numeric Telegram ID"; exit 1
          fi
      - name: Replace D1 placeholders
        env:
          WALLET_D1_ID: ${{ vars.N5_WALLET_D1_ID }}
          SCORES_D1_ID: ${{ vars.N5_SCORES_D1_ID }}
          ADMIN_TELEGRAM_USER_ID: ${{ vars.ADMIN_TELEGRAM_USER_ID }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          path=Path('wallet/wrangler.jsonc')
          data=json.loads(path.read_text())
          for key in ('WALLET_D1_ID','SCORES_D1_ID'):
              if not re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}',os.environ[key]):
                  raise SystemExit(f'Invalid {key} UUID')
              if os.environ[key] == '00000000-0000-0000-0000-000000000000':
                  raise SystemExit('Database ID placeholder not configured')
          data['d1_databases'][0]['database_id']=os.environ['WALLET_D1_ID']
          data['d1_databases'][1]['database_id']=os.environ['SCORES_D1_ID']
          assert data['vars']['TRANSFERS_ENABLED'] == 'false'
          assert data['vars']['AUTO_REWARDS_ENABLED'] == 'false'
          operator_id=os.environ['ADMIN_TELEGRAM_USER_ID']
          if not re.fullmatch(r'[1-9][0-9]{0,18}',operator_id):
              raise SystemExit('Invalid operator Telegram ID')
          data['vars']['ADMIN_TELEGRAM_USER_ID']=operator_id
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Apply wallet D1 migrations remotely
        working-directory: wallet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy isolated Wallet Worker (signing disabled)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: wallet
          wranglerVersion: "4"
          command: deploy
          secrets: |
            WALLET_SERVICE_KEY
        env:
          WALLET_SERVICE_KEY: ${{ secrets.WALLET_SERVICE_KEY }}
      - name: Release safety note
        run: |
          echo "Wallet Worker deployed in safe (non-signing) mode. Set Cloudflare secrets, verify preflight, then enable test transfers only after explicit review." >> "$GITHUB_STEP_SUMMARY"
