name: Bootstrap npm lockfile (one-time)
on:
  push:
    paths:
      - '.github/workflows/bootstrap-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock from actual npm resolution
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit deterministic resolution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: commit reproducible npm dependency resolution'
            git push origin HEAD:main
          fi
