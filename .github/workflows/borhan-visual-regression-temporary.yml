name: Temporary Borhan visual regression
on:
  push:
    branches:
      - fix/borhan-face-accessories-gold-difficulty
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run assets:check
      - run: npm run docs:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: borhan-fix-browser-screenshots
          path: test-results/
          retention-days: 7
