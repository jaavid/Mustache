name: Temporary Borhan repair formatter
on:
  push:
    branches:
      - fix/borhan-face-accessories-gold-difficulty
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/borhan-face-accessories-gold-difficulty
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/game/art.ts src/game/accessories.ts src/game/goldenFlyer.ts src/game/characterChoice.ts src/logic/__tests__/goldenRules.test.ts src/logic/__tests__/characterChoice.test.ts docs/GOLDEN_MUSTACHE.md assets/manifest.json README.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ docs/ assets/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format Borhan repair"
            git push origin HEAD:fix/borhan-face-accessories-gold-difficulty
          fi
