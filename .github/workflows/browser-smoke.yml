name: Browser smoke and screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/assets/borhan-sheet.png'
      - 'src/assets/mammad-sheet.png'
      - 'src/game/characterSelect.ts'
      - 'src/game/ramin.ts'
      - 'src/main.ts'
      - 'src/game/**/*.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/manifest.json'
      - '.github/workflows/browser-smoke.yml'
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run browser smoke and capture screenshots
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots-and-traces
          path: test-results/
          retention-days: 14
