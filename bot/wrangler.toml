name = "n5-mustache-rjttobot"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Preserve Cloudflare dashboard variables such as WALLET_API_URL across CI deploys.
keep_vars = true
workers_dev = true

# The Telegram webhook and score API must use the SAME deployed Worker.
# Without this binding Wrangler only updates workers.dev while the game calls
# mustache.zedai.ir, which previously served 404 for /api/status.
[[routes]]
pattern = "mustache.zedai.ir"
custom_domain = true

[vars]
BOT_USERNAME = "rjttobot"
GAME_SHORT_NAME = "mustache"
GAME_URL = "https://mustache.alexa.ir/"
GAME_ORIGIN = "https://mustache.alexa.ir"
# Github Pages preview/origin is owned by the same game repository.
GAME_ORIGINS = "https://jaavid.github.io"

# Internal Worker-to-Worker transport. This is configuration, NOT a credential.
# Wrangler must own the binding so GitHub deploys do not remove dashboard edits.
[[services]]
binding = "WALLET"
service = "n5-wallet-service-amoy"

# Automatically replaced by GitHub Actions using CLOUDFLARE_D1_DATABASE_ID.
# Never deploy this placeholder; create D1 and supply its UUID first.
[[d1_databases]]
binding = "DB"
database_name = "n5-mustache-scores"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
